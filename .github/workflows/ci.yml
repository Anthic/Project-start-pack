name: CI / CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ─────────────────────────────────────────
  # Job 1: CI — TypeCheck + Tests + Build
  # ─────────────────────────────────────────
  ci:
    name: TypeCheck, Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Type Check (TypeScript)
        run: npx tsc --noEmit

      - name: Run Unit Tests (Vitest)
        run: npm test

      - name: Build TypeScript Project
        run: npm run build

  # ─────────────────────────────────────────
  # Job 2: CD — Deploy to VPS (শুধু main ব্রাঞ্চে push হলে)
  # ─────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: ci                          # CI পাস না করলে deploy হবে না
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            # VPS তে project folder এ যাও
            cd ${{ secrets.APP_DIR }}

            # Latest code pull করো
            git pull origin main

            # Docker image build করো
            docker compose build app

            # Zero-downtime deploy: নতুন container তুলে পুরানো বন্ধ করো
            docker compose up -d app

            # পুরানো unused image clean করো
            docker image prune -f

            echo "✅ Deployment complete!"
